name: 每日订单同步

on:
  schedule:
    # 北京时间 10:00, 12:00, 12:30, 13:00, 14:00, 15:00, 16:00, 17:00, 18:00, 18:30
    - cron: '0 2 * * *'
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch: {}

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          pip install DrissionPage beautifulsoup4 requests
      - name: 运行 spider2 抓取 huisi
        env:
          CRAWL_USER: ${{ secrets.CRAWL_USER }}
          CRAWL_PASS: ${{ secrets.CRAWL_PASS }}
        run: python spider2.py
      - name: 推送 huisi 到秒哒
        env:
          EDGE_URL: ${{ secrets.SUPABASE_EDGE_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python push_to_miaoda.py result_huisi.txt huisi "$EDGE_URL" "$SYNC_KEY"
