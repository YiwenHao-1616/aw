name: 每日订单同步(huisi)

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC（北京 11:00）
  workflow_dispatch: {}

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 【关键修改1】装 DrissionPage + bs4 + requests，不再装 playwright
      - name: 安装依赖
        run: |
          pip install DrissionPage beautifulsoup4 requests
          # ubuntu-latest 自带 google-chrome-stable，确认存在
          which google-chrome-stable || sudo apt-get update && sudo apt-get install -y google-chrome-stable

      # 【关键】设置 CI 环境变量，让 spider2 自动启用无头模式
      - name: 运行 spider2 抓取 huisi
        env:
          CI: 'true'
        run: python spider2.py

      - name: 推送 huisi 到秒哒
        env:
          EDGE_URL: ${{ secrets.SUPABASE_EDGE_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python push_to_miaoda.py result_huisi.txt huisi "$EDGE_URL" "$SYNC_KEY"
