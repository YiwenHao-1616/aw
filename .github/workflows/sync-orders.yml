name: 每日订单同步

on:
  schedule:
    # 每天 03:00 UTC（= 北京时间 11:00）。想改时间改这里
    - cron: '0 3 * * *'
  workflow_dispatch: {}  # 允许手动触发，测试必用

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: 抓取订单
        env:
          CRAWL_USER: ${{ secrets.CRAWL_USER }}
          CRAWL_PASS: ${{ secrets.CRAWL_PASS }}
        run: python crawl_orders.py
        # 你的脚本需输出 result_huisi.json 和 result_jiahui.json

      - name: 推送 huisi 到秒哒
        env:
          EDGE_URL: ${{ secrets.SUPABASE_EDGE_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python push_to_miaoda.py result_huisi.json huisi "$EDGE_URL" "$SYNC_KEY"

      - name: 推送 jiahui 到秒哒
        env:
          EDGE_URL: ${{ secrets.SUPABASE_EDGE_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python push_to_miaoda.py result_jiahui.json jiahui "$EDGE_URL" "$SYNC_KEY"
